<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>stock·pipeline 스튜디오 콘솔</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>

<!-- ═══════════════ 상단 글로벌 헤더 ═══════════════ -->
<header class="topbar">
  <div class="brand">
    <div class="logo-mark">
      <span>▶</span>
    </div>
    <div class="brand-text">
      <div class="name-row">
        <span class="name">stock·pipeline</span>
        <span class="badge-pro">PRO STUDIO</span>
      </div>
      <div class="sub">4K AI 주식 영상 자동화 파이프라인</div>
    </div>
  </div>

  <!-- 메인 탭 네비게이션 -->
  <nav class="nav-tabs" id="nav-tabs">
    <button class="tab-btn on" data-tab="videos">
      <span class="tab-icon">🎬</span> 영상 아카이브
    </button>
    <button class="tab-btn" data-tab="analytics">
      <span class="tab-icon">📊</span> 종목 분석 기록
    </button>
    <button class="tab-btn" data-tab="operations">
      <span class="tab-icon">⚙️</span> 시스템 & 운영
    </button>
  </nav>

  <div class="spacer"></div>

  <!-- 상태 뱃지 (Pills) -->
  <div class="status-pills" id="pills"></div>

  <!-- 백그라운드 작업 인디케이터 -->
  <div class="jobchip" id="jobchip" hidden>
    <span class="spin"></span>
    <span id="jobchip-text">작업 중</span>
  </div>

  <!-- 상단 핵심 퀵 액션 -->
  <div class="topactions">
    <button class="btn btn-secondary" id="btn-sync" title="새로 생성된 영상 아카이브 동기화">
      <span class="btn-icon">🔄</span> 동기화
    </button>
    <button class="btn btn-primary" id="btn-open-run">
      <span class="btn-icon">▶</span> 배치 실행
    </button>
  </div>
</header>

<main class="shell">
  <!-- ═══════════════ 핵심 KPI 요약 카드 (4대 핵심 메트릭) ═══════════════ -->
  <section class="kpi-grid" id="stats">
    <div class="kpi-card skeleton"></div>
    <div class="kpi-card skeleton"></div>
    <div class="kpi-card skeleton"></div>
    <div class="kpi-card skeleton"></div>
  </section>

  <!-- 알림 배너 (누락 설정 등) -->
  <div id="banner"></div>

  <!-- ═══════════════ 탭 1: 영상 아카이브 (기본) ═══════════════ -->
  <section class="tab-pane active" id="pane-videos">
    <div class="layout-2col">
      <!-- 좌측: 실행 날짜 피드 -->
      <aside class="sidebar-runs">
        <div class="sidebar-head">
          <span class="sidebar-title">📅 제작 이력</span>
          <button class="link-btn" id="runs-reload">새로고침</button>
        </div>
        <div id="runs-list" class="runs-list">
          <div class="skeleton-list"><span></span><span></span><span></span></div>
        </div>
      </aside>

      <!-- 우측: 영상 카드/테이블 뷰 -->
      <section class="main-content">
        <!-- 실행 메타 헤더 -->
        <div id="runhead" class="run-meta-box"></div>

        <!-- 필터 & 검색 툴바 -->
        <div id="toolbar" class="toolbar-box" hidden>
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input id="q" type="search" placeholder="종목명 또는 코드 검색..." autocomplete="off" />
          </div>

          <div class="filter-chips" id="filters"></div>

          <div class="spacer"></div>

          <!-- 구글 드라이브 일괄 전송 액션 -->
          <div class="gdrive-batch-bar" id="gdrive-actions">
            <label class="select-all-label">
              <input type="checkbox" id="chk-select-all" /> 전체 선택
            </label>
            <button id="btn-gdrive-export" class="btn btn-gdrive sm">
              ☁️ 구글 드라이브 전송 (<span id="selected-count">0</span>)
            </button>
          </div>

          <!-- 뷰 토글 (카드 / 표) -->
          <div class="view-toggle" id="viewtoggle">
            <button class="view-btn on" data-view="card" title="카드 뷰">▦ 카드</button>
            <button class="view-btn" data-view="table" title="표 뷰">▤ 표</button>
          </div>
        </div>

        <!-- 종목 영상 목록 본문 -->
        <div id="content" class="content-viewport"></div>
      </section>
    </div>
  </section>

  <!-- ═══════════════ 탭 2: 종목 분석 및 기록 (Analytics) ═══════════════ -->
  <section class="tab-pane" id="pane-analytics" hidden>
    <div class="analytics-container">
      <div class="analytics-header">
        <div>
          <h2 class="section-title">📊 종목 심층 분석 데이터베이스</h2>
          <p class="section-desc">여의도 증권사 컨센서스, PBR/BPS 저평가 지표, 수급 현황 및 5대 스토리 아키타입 실측 데이터</p>
        </div>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="analytics-search" type="search" placeholder="기업명, 업종, 티커 검색..." autocomplete="off" />
        </div>
      </div>
      <div id="analytics-content" class="analytics-grid">
        <div class="empty-state"><div class="ico">⏳</div><div>분석 데이터 로딩 중...</div></div>
      </div>
    </div>
  </section>

  <!-- ═══════════════ 탭 3: 시스템 및 운영 (Operations) ═══════════════ -->
  <section class="tab-pane" id="pane-operations" hidden>
    <div class="ops-grid">
      <!-- 1. 환경 및 진단 -->
      <div class="ops-card">
        <div class="ops-card-head">
          <h3>🩺 시스템 진단 & API 상태</h3>
          <button class="btn btn-secondary sm" id="btn-re-diag">재진단</button>
        </div>
        <div id="diag-container" class="ops-card-body">
          <div class="skeleton-list"><span></span><span></span></div>
        </div>
      </div>

      <!-- 2. 백그라운드 스케줄러 & 서버 정보 -->
      <div class="ops-card">
        <div class="ops-card-head">
          <h3>⏰ 스케줄러 & 운영 서버</h3>
        </div>
        <div id="server-info-container" class="ops-card-body"></div>
      </div>

      <!-- 3. 실시간 배치 로그 콘솔 -->
      <div class="ops-card ops-card-full">
        <div class="ops-card-head">
          <h3>📜 실시간 파이프라인 로그 콘솔</h3>
          <div class="ops-actions">
            <label class="auto-scroll-label"><input type="checkbox" id="chk-autoscroll" checked /> 자동 스크롤</label>
            <button class="btn btn-secondary sm" id="btn-refresh-log">새로고침</button>
          </div>
        </div>
        <div class="ops-card-body log-console-body">
          <pre id="log-console" class="log-console">로그를 불러오는 중...</pre>
        </div>
      </div>
    </div>
  </section>
</main>

<!-- ═══════════════ 네이티브 모달 다이얼로그 ═══════════════ -->
<dialog class="app-dialog" id="app-dialog">
  <div class="dialog-card" id="dialog-card">
    <div class="dialog-head">
      <div>
        <div class="dialog-title" id="dialog-title"></div>
        <div class="dialog-sub" id="dialog-sub"></div>
      </div>
      <button class="dialog-close" id="dialog-close" aria-label="닫기">✕</button>
    </div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-foot" id="dialog-foot"></div>
  </div>
</dialog>

<!-- 토스트 알림 컨테이너 -->
<div id="toasts" class="toasts-container"></div>

<script src="/static/app.js"></script>
</body>
</html>
